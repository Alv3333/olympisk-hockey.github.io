<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olympisk Gudahockey</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Olympisk Gudahockey</h1>
        <p class="subtitle">Statiskt 2D-retrospel för GitHub Pages (Canvas + JavaScript)</p>
      </header>

      <section id="select-panel" class="panel">
        <h2>Välj din gud</h2>
        <div id="god-list" class="god-list"></div>
        <button id="start-btn" class="primary">Starta match</button>
      </section>

      <section id="game-panel" class="panel hidden">
        <div class="hud-row">
          <span id="score">Du 0 - 0 AI</span>
          <span id="timer">Tid: 180</span>
          <span id="ability">Ability</span>
        </div>
        <canvas id="game" width="960" height="540" aria-label="Hockeyplan"></canvas>
        <p id="tutorial" class="hint"></p>
        <p class="controls">WASD = rörelse · Space = skott · E = special · R = restart</p>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
